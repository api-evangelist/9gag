aid: 9gag
name: 9GAG
description: >-
  9GAG is a Hong Kong-based global entertainment platform founded in 2008 with the
  mission to "make the world happier." It is one of the largest meme and user-generated
  humor communities on the internet, distributing funny images, GIFs, and videos across
  its website and iOS/Android apps to an audience of 150-200 million people and billions
  of monthly video views. 9GAG operates consumer-facing products (the 9GAG feed, 9GAG Pro
  subscription, and related community features) rather than a public developer API program;
  it was surfaced in the API Evangelist network as a venture-backed company (500 Global,
  Y Combinator, Freestyle Capital, True Ventures, First Round Capital, Greycroft) and has
  been enriched with its real public web, policy, and security surfaces. No official public
  API or developer portal is published as of this enrichment; the community libraries that
  exist are unofficial and reverse-engineered.
